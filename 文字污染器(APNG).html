<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字污染器</title>
<!-- 引入輕量級 APNG 編碼庫（用於打包透明 APNG 動畫） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
<style>
  :root { color-scheme: light; --ink:#332b31; --muted:#80747c; --line:#e5dce2; --paper:#fffafd; --accent:#9f6686; --soft:#f7edf3; }
  * { box-sizing:border-box; }
  body { margin:0; padding:22px 14px 34px; background:#fbf7fa; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  main { max-width:850px; margin:0 auto; }
  h1 { margin:0 0 6px; font-size:23px; letter-spacing:.03em; }
  .intro { margin:0 0 20px; color:var(--muted); font-size:14px; line-height:1.65; }
  .inputs { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label.title { display:block; margin:0 0 7px; font-size:14px; font-weight:700; }
  .hint { margin:-2px 0 7px; color:var(--muted); font-size:12px; line-height:1.5; }
  textarea { display:block; width:100%; min-height:145px; resize:vertical; border:1px solid var(--line); border-radius:11px; padding:12px; background:white; color:var(--ink); font:15px/1.8 inherit; font-family:inherit; font-size:15px; line-height:1.8; outline:none; }
  textarea:focus, select:focus, input:focus { border-color:#bd8eaa; box-shadow:0 0 0 3px #9f66861a; }
  .settings { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:14px 0; padding:12px 14px; background:#f7eff4; border:1px solid #eadde5; border-radius:11px; font-size:13px; }
  .settings label { display:flex; align-items:center; gap:8px; }
  select { border:1px solid var(--line); border-radius:7px; padding:6px 8px; background:white; color:var(--ink); font:inherit; }
  input[type="range"] { width:125px; accent-color:var(--accent); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 20px; align-items:center; }
  button { border:1px solid var(--line); border-radius:9px; padding:9px 13px; background:white; color:var(--ink); font:inherit; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:white; font-weight:650; }
  button:hover { filter:brightness(.98); }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .output-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 7px; }
  .output-head label { font-size:14px; font-weight:750; }

  /* 基礎詭異文字樣式 */
  .glitchline { background:#f6eff1; padding:16px 18px; border-radius:5px; border-left:3px solid #ad697a; transition:background .2s; }
  /* 暗色底預覽（想調深淺可改這裡的 background 色碼） */
  .glitchline.dark-preview { background:#241e22; border-left-color:#c98295; }
  .glitch { font-family:inherit; letter-spacing:.05em; color:#402b35; text-shadow:1px 0 #bb7184,-1px 0 #7b8b9b; word-break:break-word; }
  .output { min-height:220px; padding:18px; font-size:21px; line-height:2.05; overflow-wrap:anywhere; white-space:pre-wrap; }
  .output:empty::before { content:attr(data-placeholder); color:#9a8b93; text-shadow:none; letter-spacing:0; }

  /* 編輯工具列與格式樣式 */
  .editor-tools { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:12px 0 7px; }
  .editor-tools button { padding:7px 11px; }
  .editor-tools .format-red { color:#ff0000; font-weight:800; }
  .editor-tools .format-black { color:#000000; font-weight:800; }
  .editor-tools .format-bold { font-weight:800; }
  .editor-tools .format-light { font-weight:300; }
  .editor-tools .format-italic { font-style:italic; }
  .editor-tools .format-small { font-size:12px; }

  /* 套用至內文的格式 */
  .glitch font[color="#ff0000"], .glitch span[style*="rgb(255, 0, 0)"], .glitch span[style*="#ff0000"], .fmt-red { color:#ff0000 !important; }
  .fmt-black { color:#000000 !important; }
  .fmt-light { font-weight:300 !important; }
  .fmt-small { font-size:0.85em !important; }

  /* 最終預覽區的外圈均勻白邊濾鏡 */
  .final-inner { display:inline-block; max-width:100%; }
  .has-white-outline .final-inner { filter:url(#smooth-white-outline); }
  .glyph-unit { display:inline-block; will-change:transform, opacity; }

  .preview-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:13px; }
  .preview-controls label { display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; }
  .preview-controls select { padding:4px 7px; font-size:13px; }
  .replay-btn { padding:4px 9px; font-size:12px; border-radius:6px; }
  .section-gap { margin-top:25px; }
  [contenteditable="true"] { outline:none; cursor:text; }
  [contenteditable="true"]:focus { box-shadow:inset 0 0 0 1px #bd8eaa; }
  .foot { margin:8px 1px 0; color:var(--muted); font-size:12px; line-height:1.6; }
  .status { min-height:18px; margin-left:2px; color:#78506a; font-size:12px; align-self:center; }
  @media (max-width:620px) { .inputs { grid-template-columns:1fr; } textarea { min-height:115px; } h1 { font-size:21px; } .settings { align-items:flex-start; flex-direction:column; gap:10px; } }
</style>
</head>
<body>

<!-- 隱藏的 SVG 濾鏡：產生均勻無鋸齒的外圈白邊，不影響內部紅藍陰影（想改白邊透明度可調 flood-opacity） -->
<svg width="0" height="0" style="position:absolute;pointer-events:none;" aria-hidden="true">
  <defs>
    <filter id="smooth-white-outline" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="dilated"/>
      <feGaussianBlur in="dilated" stdDeviation="0.55" result="blurred"/>
      <feComponentTransfer in="blurred" result="solidMask">
        <feFuncA type="table" tableValues="0 0.25 0.85 1 1"/>
      </feComponentTransfer>
      <feFlood flood-color="#ffffff" flood-opacity="1" result="whiteColor"/>
      <feComposite in="whiteColor" in2="solidMask" operator="in" result="whiteOutline"/>
      <feMerge>
        <feMergeNode in="whiteOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<main>
  <h1>文字污染器</h1>
  <p class="intro">上面分開輸入，下面會合併成同一段詭異文字。第一格原樣保留，第二格會自動混入組合符號亂碼。</p>
  <div class="inputs">
    <section>
      <label class="title" for="plain">① 原樣文字</label>
      <p class="hint">這部分會原樣顯示；可以自己輸入怪詞、重複字或特殊符號。</p>
      <textarea id="plain" placeholder="例如：這裡是夢想希望愛醫院……" spellcheck="false"></textarea>
    </section>
    <section>
      <label class="title" for="corrupt">② 自動污染文字</label>
      <p class="hint">輸入正常文字，按產生後就會疊上詭異的符號。</p>
      <textarea id="corrupt" placeholder="例如：大家的健康是最重要的。" spellcheck="false"></textarea>
    </section>
  </div>
  <div class="settings">
    <label for="order">輸出順序
      <select id="order"><option value="plainFirst">原樣文字 → 污染文字</option><option value="corruptFirst">污染文字 → 原樣文字</option></select>
    </label>
    <label for="join">中間分隔
      <select id="join"><option value="">不加分隔</option><option value=" ">空一格</option><option value="newline">換行</option><option value=" / "> / </option></select>
    </label>
    <label for="level">污染程度 <input id="level" type="range" min="1" max="4" value="2"><span id="levelText">普通</span></label>
    <label><input id="duplicate" type="checkbox"> 偶爾重複字元</label>
  </div>
  <div class="actions">
    <button class="primary" id="make">產生文字</button>
    <button id="clear">全部清空</button>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
  <div class="output-head"><label>合併輸出（可選取編輯）</label><span class="hint">先產生文字，再選取其中一段套用格式</span></div>
  <div id="output" class="output glitch glitchline" contenteditable="true" spellcheck="false" data-placeholder="產生後，兩格文字會在這裡顯示；也可以直接編輯。" aria-label="合併輸出，可編輯"></div>
  <div class="editor-tools" aria-label="文字格式工具">
    <button type="button" class="format-red" id="redBtn">紅字</button>
    <button type="button" class="format-black" id="blackBtn">黑字</button>
    <button type="button" class="format-bold" id="boldBtn">粗體</button>
    <button type="button" class="format-light" id="lightBtn">細字</button>
    <button type="button" class="format-italic" id="italicBtn">斜體</button>
    <button type="button" class="format-small" id="smallBtn">小字</button>
    <button type="button" id="clearFormatBtn">清除格式</button>
    <span class="hint">先用滑鼠選取文字，再按格式按鈕。</span>
  </div>
  <div class="actions">
    <button class="primary" id="renderFinal">更新下方截圖成品</button>
    <span class="status" id="formatStatus" aria-live="polite"></span>
  </div>

  <!-- 最終輸出與動態預覽區塊 -->
  <div class="output-head section-gap">
    <label>最終輸出（截圖／動畫預覽）</label>
    <div class="preview-controls">
      <label>模式
        <select id="animMode">
          <option value="static">靜態顯示</option>
          <option value="typewriter">逐字出現（非循環）</option>
          <option value="drift">微幅漂移（循環）</option>
        </select>
      </label>
      <button type="button" class="replay-btn" id="replayBtn" style="display:none;">重播逐字</button>
      <label><input type="checkbox" id="whiteOutlineCheck" checked> 外圈白邊</label>
      <label><input type="checkbox" id="darkBgCheck"> 暗色底預覽</label>
    </div>
  </div>
  <div id="finalOutput" class="output glitch glitchline has-white-outline" data-placeholder="按「更新下方截圖成品」後，最終效果會顯示在這裡。" aria-live="polite"></div>
  <div class="actions" style="margin-top:10px;">
    <button type="button" class="primary" id="exportPngBtn">下載透明 PNG</button>
    <button type="button" class="primary" id="exportApngBtn">下載透明 APNG</button>
    <span class="status" id="exportStatus" aria-live="polite"></span>
  </div>
  <p class="foot">操作：編輯格式後按「更新下方截圖成品」，可在預覽區切換「靜態 / 逐字出現 / 微幅漂移」與白邊效果，再分別下載去背 PNG 或 APNG 動畫。</p>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const marks = [
    '\u0334','\u0335','\u0336','\u0337','\u0338','\u0300','\u0301','\u0302','\u0303','\u0304',
    '\u0307','\u0308','\u030A','\u0310','\u0311','\u0312','\u0313','\u0314','\u0315','\u031B',
    '\u0323','\u0324','\u0325','\u0326','\u0327','\u0328','\u032D','\u0330','\u0331','\u0340','\u0342','\u035B','\u0361'
  ];
  const extra = ['¿','̸','̷','̴','͜','͙','̢','̫'];
  const levelNames = ['微弱','普通','嚴重','失控'];
  const rand = n => Math.floor(Math.random() * n);

  // 控制預覽動畫的計時器
  let previewAnimId = null;
  let previewTimer = null;

  function stopPreviewAnimation() {
    if (previewAnimId) {
      cancelAnimationFrame(previewAnimId);
      previewAnimId = null;
    }
    if (previewTimer) {
      clearInterval(previewTimer);
      previewTimer = null;
    }
  }

  function isDecoratable(ch) {
    return !/\s/.test(ch) && !/[\p{P}\p{S}]/u.test(ch);
  }

  function corruptText(text, level, duplicate) {
    let result = '';
    for (const ch of text) {
      result += ch;
      if (!isDecoratable(ch)) continue;
      const shouldGlitch = Math.random() < (level === 1 ? .48 : level === 2 ? .72 : .88);
      if (!shouldGlitch) continue;
      const count = level === 1 ? 1 : level === 2 ? 1 + rand(2) : level === 3 ? 2 + rand(2) : 3 + rand(4);
      for (let i = 0; i < count; i++) result += marks[rand(marks.length)];
      if (level >= 3 && Math.random() < .2) result += extra[rand(extra.length)];
      if (duplicate && Math.random() < (level === 4 ? .18 : .09)) result += ch;
    }
    return result;
  }

  function generate() {
    stopPreviewAnimation();
    const p = $('plain').value;
    const c = corruptText($('corrupt').value, Number($('level').value), $('duplicate').checked);
    const [first, second] = $('order').value === 'plainFirst' ? [p, c] : [c, p];
    let sep = $('join').value;
    if (sep === 'newline') sep = '\n';
    if (!first) sep = '';
    if (!second) sep = '';
    $('output').textContent = first + sep + second;
    $('finalOutput').innerHTML = '';
    $('status').textContent = '已產生，可選取文字編輯格式。';
    $('formatStatus').textContent = '';
    $('exportStatus').textContent = '';
  }

  function applyFormat(command, value = null) {
    $('output').focus();
    document.execCommand(command, false, value);
    $('formatStatus').textContent = '已套用格式。';
  }

  function wrapSelectionWithClass(className, conflictClasses = []) {
    const editor = $('output');
    editor.focus();
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) {
      $('formatStatus').textContent = '請先反白選取要套用的文字。';
      return;
    }
    const range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return;

    const fragment = range.extractContents();
    if (conflictClasses.length) {
      fragment.querySelectorAll('*').forEach(el => {
        conflictClasses.forEach(cls => el.classList.remove(cls));
        if (className === 'fmt-black' && el.tagName === 'FONT') el.removeAttribute('color');
        if (className === 'fmt-black' && el.style && el.style.color) el.style.color = '';
        if (className === 'fmt-light' && (el.tagName === 'B' || el.tagName === 'STRONG')) {
          el.style.fontWeight = '300';
        }
      });
    }

    const span = document.createElement('span');
    span.className = className;
    span.appendChild(fragment);
    range.insertNode(span);

    sel.removeAllRanges();
    const newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.addRange(newRange);
    $('formatStatus').textContent = '已套用格式。';
  }

  const toolBtns = ['redBtn', 'blackBtn', 'boldBtn', 'lightBtn', 'italicBtn', 'smallBtn', 'clearFormatBtn'];
  toolBtns.forEach(id => $(id).addEventListener('mousedown', e => e.preventDefault()));

  $('redBtn').addEventListener('click', () => wrapSelectionWithClass('fmt-red', ['fmt-black']));
  $('blackBtn').addEventListener('click', () => wrapSelectionWithClass('fmt-black', ['fmt-red']));
  $('boldBtn').addEventListener('click', () => applyFormat('bold'));
  $('lightBtn').addEventListener('click', () => wrapSelectionWithClass('fmt-light'));
  $('italicBtn').addEventListener('click', () => applyFormat('italic'));
  $('smallBtn').addEventListener('click', () => wrapSelectionWithClass('fmt-small'));

  $('clearFormatBtn').addEventListener('click', () => {
    const editor = $('output');
    editor.focus();
    const sel = window.getSelection();
    if (sel.rangeCount && !sel.isCollapsed) {
      const range = sel.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) {
        const plainText = range.toString();
        range.deleteContents();
        range.insertNode(document.createTextNode(plainText));
        $('formatStatus').textContent = '已清除所選文字格式。';
        return;
      }
    }
    document.execCommand('removeFormat', false, null);
    $('formatStatus').textContent = '已清除所選文字格式。';
  });

  // 將節點內的文字拆成「字元＋所屬組合亂碼」的獨立單位（方便逐字與各自漂移）
  const segmenter = typeof Intl !== 'undefined' && Intl.Segmenter
    ? new Intl.Segmenter('zh-Hant', { granularity: 'grapheme' })
    : null;

  function splitGraphemes(str) {
    if (segmenter) {
      return Array.from(segmenter.segment(str), s => s.segment);
    }
    return Array.from(str);
  }

  function wrapGlyphUnits(rootEl) {
    const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue) textNodes.push(node);
    }

    let unitIndex = 0;
    const units = [];

    textNodes.forEach(tNode => {
      const val = tNode.nodeValue;
      const frag = document.createDocumentFragment();
      // 保留換行符，將其他字元包成獨立 glyph-unit
      const parts = val.split(/(\n)/);
      parts.forEach(part => {
        if (part === '\n') {
          frag.appendChild(document.createTextNode('\n'));
        } else if (part.length > 0) {
          const graphemes = splitGraphemes(part);
          graphemes.forEach(g => {
            if (/\s/.test(g)) {
              // 空白保留寬度但也納入逐字節奏
              const sp = document.createElement('span');
              sp.className = 'glyph-unit is-space';
              sp.dataset.idx = unitIndex++;
              sp.textContent = g;
              frag.appendChild(sp);
              units.push(sp);
            } else {
              const sp = document.createElement('span');
              sp.className = 'glyph-unit';
              sp.dataset.idx = unitIndex++;
              sp.textContent = g;
              frag.appendChild(sp);
              units.push(sp);
            }
          });
        }
      });
      tNode.parentNode.replaceChild(frag, tNode);
    });

    return units;
  }

  // 計算第 idx 個字在週期 t (0 ~ 2π) 的微幅漂移與旋轉
  function getDriftTransform(idx, t) {
    // 每個字給不同相位，產生各自獨立漂浮的詭異感
    const phaseX = idx * 1.73;
    const phaseY = idx * 2.39 + 0.8;
    const phaseR = idx * 1.41 + 1.5;

    const dx = Math.sin(t + phaseX) * 1.25 + Math.cos(t * 2 + phaseY) * 0.35;
    const dy = Math.cos(t + phaseY) * 1.45 + Math.sin(t * 2 + phaseX) * 0.35;
    const rot = Math.sin(t + phaseR) * 1.65; // 約 ±1.65 度微幅旋轉
    return `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`;
  }

  function applyPreviewMode() {
    stopPreviewAnimation();
    const mode = $('animMode').value;
    $('replayBtn').style.display = mode === 'typewriter' ? 'inline-block' : 'none';

    const inner = $('finalOutput').querySelector('.final-inner');
    if (!inner) return;

    const units = Array.from(inner.querySelectorAll('.glyph-unit'));
    // 重置所有字元狀態
    units.forEach(u => {
      u.style.opacity = '1';
      u.style.transform = 'none';
    });

    if (mode === 'typewriter') {
      // 遊戲對話框節奏：約 55ms 跳出一個字
      units.forEach(u => { u.style.opacity = '0'; });
      let current = 0;
      previewTimer = setInterval(() => {
        if (current >= units.length) {
          stopPreviewAnimation();
          return;
        }
        units[current].style.opacity = '1';
        current++;
      }, 55);
    } else if (mode === 'drift') {
      // 循環漂浮：2.4 秒一個完整週期
      const duration = 2400;
      const start = performance.now();
      const tick = now => {
        const elapsed = (now - start) % duration;
        const t = (elapsed / duration) * Math.PI * 2;
        for (let i = 0; i < units.length; i++) {
          if (!units[i].classList.contains('is-space')) {
            units[i].style.transform = getDriftTransform(i, t);
          }
        }
        previewAnimId = requestAnimationFrame(tick);
      };
      previewAnimId = requestAnimationFrame(tick);
    }
  }

  function renderFinalOutput() {
    const html = $('output').innerHTML;
    if (!html.trim()) {
      stopPreviewAnimation();
      $('finalOutput').innerHTML = '';
      return;
    }
    const wrapper = document.createElement('span');
    wrapper.className = 'final-inner';
    wrapper.innerHTML = html;
    wrapGlyphUnits(wrapper);

    $('finalOutput').innerHTML = '';
    $('finalOutput').appendChild(wrapper);
    $('formatStatus').textContent = '已更新最終截圖／動畫預覽。';
    applyPreviewMode();
  }

  $('renderFinal').addEventListener('click', renderFinalOutput);
  $('animMode').addEventListener('change', applyPreviewMode);
  $('replayBtn').addEventListener('click', applyPreviewMode);

  // 預覽選項切換
  $('whiteOutlineCheck').addEventListener('change', e => {
    $('finalOutput').classList.toggle('has-white-outline', e.target.checked);
  });
  $('darkBgCheck').addEventListener('change', e => {
    $('finalOutput').classList.toggle('dark-preview', e.target.checked);
  });

async function renderFrameToCanvas(cloneInner, width, height, padX, padY, scale, hasOutline, computedFont) {
    // 1. 建立暫時測量容器，讓瀏覽器計算每個字元真實的排版位置與換行
    const measureHost = document.createElement('div');
    measureHost.style.cssText = `
      position:fixed;
      left:-99999px;
      top:0;
      width:${Math.max(300, $('finalOutput').clientWidth || 700)}px;
      font-family:${computedFont};
      font-size:21px;
      line-height:2.05;
      letter-spacing:0.05em;
      white-space:pre-wrap;
      word-break:break-word;
      overflow-wrap:anywhere;
      visibility:hidden;
      pointer-events:none;
    `;
    measureHost.appendChild(cloneInner);
    document.body.appendChild(measureHost);

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    const baseRect = cloneInner.getBoundingClientRect();
    const units = Array.from(cloneInner.querySelectorAll('.glyph-unit'));

    // 先暫時移除 transform，取得每個字元原本的靜態排版中心點
    const savedTransforms = units.map(u => u.style.transform);
    units.forEach(u => { u.style.transform = 'none'; });
    const baseUnitRects = units.map(u => u.getBoundingClientRect());
    units.forEach((u, i) => { u.style.transform = savedTransforms[i] || ''; });

    // 2. 建立文字層 Canvas
    const textCanvas = document.createElement('canvas');
    textCanvas.width = width * scale;
    textCanvas.height = height * scale;
    const tCtx = textCanvas.getContext('2d');
    tCtx.scale(scale, scale);

    units.forEach((u, idx) => {
      const opacity = parseFloat(u.style.opacity === '' ? '1' : u.style.opacity);
      if (opacity <= 0 || u.classList.contains('is-space')) return;

      const cs = getComputedStyle(u);
      const fontSize = parseFloat(cs.fontSize) || 21;
      const fontWeight = cs.fontWeight || '400';
      const fontStyle = cs.fontStyle || 'normal';
      const color = cs.color || '#402b35';

      const tf = u.style.transform || '';
      const txMatch = tf.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
      const rotMatch = tf.match(/rotate\(([-\d.]+)deg\)/);
      const dx = txMatch ? parseFloat(txMatch[1]) : 0;
      const dy = txMatch ? parseFloat(txMatch[2]) : 0;
      const rotRad = rotMatch ? (parseFloat(rotMatch[1]) * Math.PI) / 180 : 0;

      const r = baseUnitRects[idx];
      const cx = (r.left - baseRect.left) + padX + r.width / 2 + dx;
      const cy = (r.top - baseRect.top) + padY + r.height / 2 + dy;

      tCtx.save();
      tCtx.globalAlpha = opacity;
      tCtx.translate(cx, cy);
      if (rotRad) tCtx.rotate(rotRad);

      tCtx.font = `${fontStyle} ${fontWeight} ${fontSize}px ${computedFont}`;
      tCtx.textAlign = 'center';
      tCtx.textBaseline = 'middle';

      tCtx.fillStyle = '#bb7184';
      tCtx.fillText(u.textContent, 1, 0);

      tCtx.fillStyle = '#7b8b9b';
      tCtx.fillText(u.textContent, -1, 0);

      tCtx.fillStyle = color;
      tCtx.fillText(u.textContent, 0, 0);

      tCtx.restore();
    });

    // 量測與繪製完成後立刻移除暫時容器
    document.body.removeChild(measureHost);

    // 3. 建立最終輸出 Canvas 與外圈白邊
    const outCanvas = document.createElement('canvas');
    outCanvas.width = width * scale;
    outCanvas.height = height * scale;
    const oCtx = outCanvas.getContext('2d');

    if (hasOutline) {
      const floodEl = document.querySelector('#smooth-white-outline feFlood');
      const outlineOpacity = floodEl ? parseFloat(floodEl.getAttribute('flood-opacity') || '1') : 1;

      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = outCanvas.width;
      maskCanvas.height = outCanvas.height;
      const mCtx = maskCanvas.getContext('2d');

      const radiusPx = 4.5 * scale;
      const steps = 24;
      for (let i = 0; i < steps; i++) {
        const angle = (i / steps) * Math.PI * 2;
        const ox = Math.cos(angle) * radiusPx;
        const oy = Math.sin(angle) * radiusPx;
        mCtx.drawImage(textCanvas, ox, oy);
      }

      mCtx.globalCompositeOperation = 'source-in';
      mCtx.fillStyle = `rgba(255, 255, 255, ${outlineOpacity})`;
      mCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);

      oCtx.drawImage(maskCanvas, 0, 0);
    }

    oCtx.drawImage(textCanvas, 0, 0);
    return outCanvas;
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // 1. 下載靜態透明 PNG
  $('exportPngBtn').addEventListener('click', async () => {
    const inner = $('finalOutput').querySelector('.final-inner');
    if (!inner || !inner.textContent.trim()) {
      $('exportStatus').textContent = '請先按「更新下方截圖成品」產生內容再下載。';
      return;
    }

    $('exportStatus').textContent = '正在產生高解析透明 PNG...';
    const hasOutline = $('whiteOutlineCheck').checked;
    const rect = inner.getBoundingClientRect();
    const padX = 24;
    const padY = 34;
    const width = Math.ceil(rect.width) + padX * 2;
    const height = Math.ceil(rect.height) + padY * 2;
    const scale = 2;
    const computedFont = getComputedStyle($('finalOutput')).fontFamily;

    // 複製一份完整顯示、無位移的純淨狀態
    const clone = inner.cloneNode(true);
    clone.querySelectorAll('.glyph-unit').forEach(u => {
      u.style.opacity = '1';
      u.style.transform = 'none';
    });

    try {
      const canvas = await renderFrameToCanvas(clone, width, height, padX, padY, scale, hasOutline, computedFont);
      canvas.toBlob(blob => {
        if (!blob) {
          $('exportStatus').textContent = 'PNG 匯出失敗，請重試。';
          return;
        }
        triggerDownload(blob, `文字污染_${Date.now()}.png`);
        $('exportStatus').textContent = '已下載透明 PNG 圖片！';
      }, 'image/png');
    } catch (err) {
      $('exportStatus').textContent = '圖片渲染發生錯誤，請確認瀏覽器版本。';
    }
  });

  // 2. 下載透明 APNG（支援逐字非循環 & 微幅漂移循環）
  $('exportApngBtn').addEventListener('click', async () => {
    const inner = $('finalOutput').querySelector('.final-inner');
    if (!inner || !inner.textContent.trim()) {
      $('exportStatus').textContent = '請先按「更新下方截圖成品」產生內容再下載。';
      return;
    }
    if (typeof UPNG === 'undefined') {
      $('exportStatus').textContent = 'APNG 編碼器尚未載入完成（需網路連線載入 UPNG），請稍候再試。';
      return;
    }

    const mode = $('animMode').value;
    // 若使用者停在靜態模式直接按下載 APNG，預設匯出「逐字出現（非循環）」
    const exportMode = mode === 'static' ? 'typewriter' : mode;

    const btnPng = $('exportPngBtn');
    const btnApng = $('exportApngBtn');
    btnPng.disabled = true;
    btnApng.disabled = true;

    const hasOutline = $('whiteOutlineCheck').checked;
    const rect = inner.getBoundingClientRect();
    const padX = 26;
    const padY = 36;
    const width = Math.ceil(rect.width) + padX * 2;
    const height = Math.ceil(rect.height) + padY * 2;
    const scale = 2; // 2 倍高解析度
    const computedFont = getComputedStyle($('finalOutput')).fontFamily;

    const framesData = [];
    const delays = [];

    try {
      if (exportMode === 'typewriter') {
        // 逐字出現（非循環 APNG，遊戲對話框節奏）
        const baseClone = inner.cloneNode(true);
        const totalUnits = baseClone.querySelectorAll('.glyph-unit').length;
        // 若字數非常多，自動微調步進避免檔案過大
        const step = totalUnits > 80 ? 2 : 1;
        const frameDelay = step === 1 ? 55 : 75;

        for (let count = 1; count <= totalUnits; count += step) {
          $('exportStatus').textContent = `正在渲染逐字 APNG（${Math.min(count, totalUnits)} / ${totalUnits}）...`;
          const clone = inner.cloneNode(true);
          const units = clone.querySelectorAll('.glyph-unit');
          units.forEach((u, idx) => {
            u.style.transform = 'none';
            u.style.opacity = idx < count ? '1' : '0';
          });
          const canvas = await renderFrameToCanvas(clone, width, height, padX, padY, scale, hasOutline, computedFont);
          const ctx = canvas.getContext('2d');
          framesData.push(ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer);
          // 最後一格停頓久一點（1200ms），其餘按遊戲對話框速度推進
          delays.push(count + step > totalUnits ? 1200 : frameDelay);
        }

        // 確保最後一格一定包含完整所有字
        if ((totalUnits - 1) % step !== 0) {
          const clone = inner.cloneNode(true);
          clone.querySelectorAll('.glyph-unit').forEach(u => {
            u.style.transform = 'none';
            u.style.opacity = '1';
          });
          const canvas = await renderFrameToCanvas(clone, width, height, padX, padY, scale, hasOutline, computedFont);
          framesData.push(canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data.buffer);
          delays.push(1200);
        }

        $('exportStatus').textContent = '正在封裝非循環 APNG...';
        await new Promise(r => setTimeout(r, 20));
        // UPNG.encode(imgs, w, h, cnum, dels, tabs) -> cnum=0 表示無損全彩透明
        const apngBuffer = UPNG.encode(framesData, width * scale, height * scale, 0, delays);
        // 修改 acTL 的 num_plays 為 1（非循環，只播放一次停在最後一格）
        const finalBuffer = setApngLoopCount(apngBuffer, 1);
        triggerDownload(new Blob([finalBuffer], { type: 'image/png' }), `文字污染_逐字_${Date.now()}.png`);
        $('exportStatus').textContent = '已下載逐字出現（非循環）透明 APNG！';

      } else {
        // 各自微幅上下左右旋轉漂移（無縫循環 APNG）
        const totalFrames = 24; // 24 格完整正弦週期，首尾無縫銜接
        const frameDelay = 90;  // 約 2.16 秒一圈，緩慢詭異漂浮

        for (let f = 0; f < totalFrames; f++) {
          $('exportStatus').textContent = `正在渲染漂移 APNG（影格 ${f + 1} / ${totalFrames}）...`;
          const t = (f / totalFrames) * Math.PI * 2;
          const clone = inner.cloneNode(true);
          const units = clone.querySelectorAll('.glyph-unit');
          units.forEach((u, idx) => {
            u.style.opacity = '1';
            if (!u.classList.contains('is-space')) {
              u.style.transform = getDriftTransform(idx, t);
            }
          });
          const canvas = await renderFrameToCanvas(clone, width, height, padX, padY, scale, hasOutline, computedFont);
          const ctx = canvas.getContext('2d');
          framesData.push(ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer);
          delays.push(frameDelay);
        }

        $('exportStatus').textContent = '正在封裝循環 APNG...';
        await new Promise(r => setTimeout(r, 20));
        const apngBuffer = UPNG.encode(framesData, width * scale, height * scale, 0, delays);
        // num_plays = 0 代表無限循環
        const finalBuffer = setApngLoopCount(apngBuffer, 0);
        triggerDownload(new Blob([finalBuffer], { type: 'image/png' }), `文字污染_漂移_${Date.now()}.png`);
        $('exportStatus').textContent = '已下載微幅漂移（循環）透明 APNG！';
      }
    } catch (err) {
      $('exportStatus').textContent = 'APNG 產生失敗：' + (err.message || '未知錯誤');
    } finally {
      btnPng.disabled = false;
      btnApng.disabled = false;
    }
  });

  // 精準設定 APNG acTL 區塊的播放次數（0 = 無限循環，1 = 播一次停止）並重算 CRC32
  function setApngLoopCount(arrayBuffer, numPlays) {
    const bytes = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);
    let offset = 8; // 跳過 PNG 8-byte 檔頭
    while (offset < bytes.length) {
      const length = view.getUint32(offset);
      const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
      if (type === 'acTL' && length === 8) {
        // acTL data: [0..3] num_frames, [4..7] num_plays
        view.setUint32(offset + 12, numPlays);
        const crc = crc32(bytes, offset + 4, 12);
        view.setUint32(offset + 16, crc);
        break;
      }
      offset += 12 + length;
    }
    return arrayBuffer;
  }

  const crcTable = (() => {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c;
    }
    return table;
  })();

  function crc32(buf, start, len) {
    let c = 0xffffffff;
    for (let i = start; i < start + len; i++) {
      c = crcTable[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
    }
    return (c ^ 0xffffffff) >>> 0;
  }

  $('make').addEventListener('click', generate);
  $('level').addEventListener('input', () => { $('levelText').textContent = levelNames[Number($('level').value) - 1]; });
  $('clear').addEventListener('click', () => {
    stopPreviewAnimation();
    $('plain').value = '';
    $('corrupt').value = '';
    $('output').textContent = '';
    $('finalOutput').innerHTML = '';
    $('status').textContent = '已清空。';
    $('formatStatus').textContent = '';
    $('exportStatus').textContent = '';
    $('plain').focus();
  });
})();
</script>
