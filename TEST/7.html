<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS 자기소개표 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --accent:#ec6a8f;
    --accent-text:#ffffff;
    --black:#141414;
    --darkgray:#5a5a5a;
    --white:#ffffff;
    --pale:#f5f5f6;
    --pale2:#eeeef0;
    --line:#e3e3e6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background:#e9e9ec;
    color:var(--black);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:1400px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  .app-header{
    text-align:center;
    margin-bottom:28px;
  }
  .app-header h1{
    font-size:22px;
    font-weight:900;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .app-header p{
    font-size:13px;
    color:var(--darkgray);
    margin:0;
  }
  .layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:960px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---------- editor panel ---------- */
  .editor{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    max-height:calc(100vh - 60px);
    overflow-y:auto;
    position:sticky;
    top:20px;
  }
  .editor::-webkit-scrollbar{width:6px;}
  .editor::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .group{
    margin-bottom:22px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}

  .group-title{
    font-size:12px;
    font-weight:700;
    color:var(--black);
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:12px;
    letter-spacing:0.02em;
  }
  .group-title .tag{
    display:inline-block;
    width:6px;height:6px;
    border-radius:2px;
    background:var(--accent);
  }
  .field{margin-bottom:10px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--darkgray);
    margin-bottom:5px;
    font-weight:500;
  }
  .field input[type="text"],
  .field textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--pale);
    border-radius:8px;
    padding:9px 10px;
    font-family:inherit;
    font-size:13px;
    color:var(--black);
    resize:vertical;
  }
  .field textarea{min-height:56px;}
  .field input[type="text"]:focus,
  .field textarea:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--white);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

  .color-row{display:flex;align-items:center;gap:10px;}
  .color-row input[type="color"]{
    width:40px;height:32px;border:1px solid var(--line);border-radius:8px;
    padding:0;cursor:pointer;background:none;
  }
  .color-row span{font-size:12px;color:var(--darkgray);}

  .upload-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:500;color:var(--black);
    background:var(--pale);border:1px dashed #c9c9cc;
    border-radius:8px;padding:9px 12px;cursor:pointer;
    width:100%;justify-content:center;
  }
  .upload-btn:hover{border-color:var(--accent);}
  .upload-btn input{display:none;}

  .mini-btn{
    font-family:inherit;
    font-size:11.5px;font-weight:500;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--darkgray);
    border-radius:7px;
    padding:6px 10px;
    cursor:pointer;
  }
  .mini-btn:hover{border-color:var(--accent);color:var(--black);}
  .mini-btn.primary{
    background:var(--black);color:var(--white);border-color:var(--black);
  }
  .mini-btn:disabled{opacity:0.35;cursor:not-allowed;}

  .sticker-item, .pair-editor-item{
    display:flex;align-items:center;gap:8px;
    background:var(--pale);border:1px solid var(--line);
    border-radius:8px;padding:8px;margin-bottom:8px;
  }
  .sticker-thumb{
    width:34px;height:34px;border-radius:6px;object-fit:cover;
    background:var(--pale2);flex-shrink:0;
  }
  .sticker-item span{font-size:11.5px;color:var(--darkgray);flex:1;}

  .pair-editor-item{flex-direction:column;align-items:stretch;gap:8px;padding:12px;}
  .pair-editor-head{display:flex;align-items:center;justify-content:space-between;}
  .pair-editor-head b{font-size:12px;}
  .icon-choice{display:flex;gap:6px;}
  .icon-choice button{
    border:1px solid var(--line);background:var(--white);
    border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;color:var(--darkgray);
  }
  .icon-choice button.active{border-color:var(--accent);color:var(--accent);background:var(--pale);}
  .shape-choice{display:flex;gap:6px;}
  .shape-choice button{
    flex:1;border:1px solid var(--line);background:var(--white);
    border-radius:7px;padding:6px 0;cursor:pointer;font-size:11px;color:var(--darkgray);
  }
  .shape-choice button.active{border-color:var(--accent);color:var(--black);background:var(--pale);font-weight:700;}

  .hashtag-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .htag-btn{
    font-family:inherit;font-size:12px;font-weight:500;
    border:1px solid var(--line);background:var(--white);color:var(--darkgray);
    border-radius:999px;padding:5px 11px;cursor:pointer;
  }
  .htag-btn.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
  .htag-add-row{display:flex;gap:6px;margin-bottom:8px;}
  .htag-add-row input{flex:1;}
  .selected-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .selected-tag-chip{
    display:flex;align-items:center;gap:5px;
    font-size:11.5px;background:var(--pale2);color:var(--black);
    border-radius:999px;padding:4px 8px 4px 10px;
  }
  .selected-tag-chip button{
    border:none;background:none;cursor:pointer;color:var(--darkgray);font-size:12px;line-height:1;padding:0;
  }

  .download-bar{
    margin-top:18px;
    display:flex;gap:8px;
  }
  .download-bar button{
    flex:1;
    font-family:inherit;font-weight:700;font-size:13.5px;
    background:var(--black);color:var(--white);
    border:none;border-radius:10px;padding:12px;cursor:pointer;
  }
  .download-bar button:hover{background:var(--accent);}
  .hint{font-size:11px;color:var(--darkgray);margin-top:8px;line-height:1.5;}

  /* ---------- preview / card ---------- */
  .preview-wrap{display:flex;flex-direction:column;align-items:center;}
  #card{
    position:relative;
    width:100%;
    max-width:820px;
    background:linear-gradient(180deg,#ffffff 0%, var(--pale) 100%);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
    font-family:'Noto Sans KR', sans-serif;
  }

  .banner-area{
    position:relative;
    width:100%;
    height:0;
    padding-bottom:33.333%;
    background:var(--pale2);
    background-size:cover;
    background-position:center;
  }
  .banner-placeholder{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:#b7b7ba;font-size:12px;font-weight:500;
    pointer-events:none;
  }
  #stickerLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
  }
  .sticker{
    position:absolute;
    cursor:grab;
    user-select:none;
    touch-action:none;
    pointer-events:auto;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }
  .sticker img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;}
  .sticker.dragging{cursor:grabbing;}

  .card-body{padding:26px 30px 34px;}

  .section-label{
    display:flex;align-items:center;gap:8px;
    margin:22px 0 14px;
  }
  .section-label:first-child{margin-top:0;}
  .section-label .bar{
    width:5px;height:16px;border-radius:2px;background:var(--accent);
  }
  .section-label span{
    font-size:13px;font-weight:900;letter-spacing:0.06em;color:var(--black);
  }

  .identity-row{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin-bottom:10px;
  }
  .nickname{font-size:20px;font-weight:900;color:var(--black);}
  .account{font-size:13.5px;font-weight:500;color:var(--darkgray);}

  .hashtag-preview{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .hchip{
    font-size:12px;font-weight:700;color:var(--accent);
    background:var(--pale2);border-radius:999px;padding:5px 12px;
  }

  .info-box{
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--pale);
    margin-bottom:10px;
    padding:11px 14px 13px;
  }
  .info-head{margin-bottom:6px;}
  .info-head b{font-size:12.5px;font-weight:700;color:var(--black);}
  .info-content{
    font-size:12.5px;line-height:1.65;color:var(--darkgray);
  }
  .bullet-line{
    display:flex;align-items:flex-start;gap:7px;
    margin-bottom:5px;font-size:12.5px;line-height:1.6;color:var(--darkgray);
  }
  .bullet-line:last-child{margin-bottom:0;}
  .bullet-dot{
    width:5px;height:5px;min-width:5px;
    border-radius:50%;background:var(--darkgray);
    margin-top:7px;flex-shrink:0;
  }
  .bullet-line.placeholder{color:#b7b7ba;}
  .bullet-line.placeholder .bullet-dot{display:none;}

  .pair-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:16px;
  }
  .pair-card{display:flex;flex-direction:column;}
  .pair-photo{
    position:relative;
    width:100%;
    height:0;
    border-radius:12px;
    overflow:hidden;
    background:var(--pale2);
  }
  .pair-photo.rect{padding-bottom:75%;}
  .pair-photo.square{padding-bottom:100%;}
  .pair-photo img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  }
  .pair-photo .grad{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0) 78%);
    pointer-events:none;
  }
  .pair-photo .pair-text{
    position:absolute;left:0;right:0;bottom:0;
    padding:10px 11px 9px;
  }
  .pair-photo-empty{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:#b7b7ba;font-size:11px;
  }
  .pair-name{
    font-size:13.5px;font-weight:900;color:var(--black);
    display:flex;align-items:center;gap:4px;
  }
  .pair-name .ico{color:var(--accent);font-size:12px;}
  .pair-desc{
    font-size:11.5px;font-weight:500;color:var(--darkgray);margin-top:2px;
  }
  .pair-no-photo-text{margin-top:8px;}
  .pair-no-photo-text .pair-name{color:var(--black);}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <h1>SNS 자기소개표 생성기</h1>
    <p>왼쪽에서 내용을 입력하면 오른쪽 미리보기가 실시간으로 바뀝니다. 완성되면 이미지로 저장하세요.</p>
  </div>

  <div class="layout">
    <!-- ================= EDITOR ================= -->
    <div class="editor">

      <div class="group">
        <div class="group-title"><span class="tag"></span>포인트 컬러</div>
        <div class="color-row">
          <input type="color" id="accentPicker" value="#ec6a8f">
          <span>글씨는 검은색·진회색·하얀색·포인트 컬러만 사용됩니다.</span>
        </div>
      </div>

      <div class="group">
        <div class="group-title"><span class="tag"></span>배너 &amp; 스티커</div>
        <div class="field">
          <label>배너 이미지 (트위터 헤더 사이즈, 3:1)</label>
          <label class="upload-btn">배너 사진 업로드
            <input type="file" id="bannerInput" accept="image/*">
          </label>
        </div>
        <div class="field">
          <label>PNG 스티커 (최대 3개, 배너 위에서 드래그로 위치 조정)</label>
          <label class="upload-btn" id="stickerUploadBtn">스티커 추가
            <input type="file" id="stickerInput" accept="image/png">
          </label>
          <div id="stickerList"></div>
        </div>
      </div>

      <div class="group">
        <div class="group-title"><span class="tag"></span>기본 정보</div>
        <div class="field">
          <label>닉네임 / 계정</label>
          <div class="row2">
            <input type="text" id="nicknameInput" placeholder="닉네임">
            <input type="text" id="accountInput" placeholder="@계정">
          </div>
        </div>
        <div class="field">
          <label>해시태그 (선택 또는 직접 입력)</label>
          <div class="hashtag-presets" id="hashtagPresets"></div>
          <div class="htag-add-row">
            <input type="text" id="customTagInput" placeholder="태그 직접 입력 후 추가">
            <button class="mini-btn primary" id="addTagBtn">추가</button>
          </div>
          <div class="selected-tags" id="selectedTagsBox"></div>
        </div>
      </div>

      <div class="group">
        <div class="group-title"><span class="tag"></span>안내사항 / 주의사항</div>
        <div class="field">
          <label>안내사항 (줄바꿈마다 글머리기호로 표시)</label>
          <textarea id="guideInput" placeholder="예) 팔로우 전 프로필 확인 부탁드려요"></textarea>
        </div>
        <div class="field">
          <label>주의사항 (줄바꿈마다 글머리기호로 표시)</label>
          <textarea id="cautionInput" placeholder="예) 특정 소재/전개 언급 시 주의해주세요"></textarea>
        </div>
      </div>

      <div class="group">
        <div class="group-title"><span class="tag"></span>PAIR 목록 (1~8개)</div>
        <div id="pairEditorList"></div>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="mini-btn" id="addPairBtn">+ 페어 추가</button>
        </div>
      </div>

      <div class="download-bar">
        <button id="downloadBtn">이미지로 저장</button>
      </div>
      <div class="hint">배너 영역을 클릭한 채로 드래그하면 사진 위치를 조정할 수 있어요.</div>
    </div>

    <!-- ================= PREVIEW ================= -->
    <div class="preview-wrap">
      <div id="card">
        <div class="banner-area" id="bannerArea">
          <div class="banner-placeholder" id="bannerPlaceholder">배너 사진을 업로드해주세요 (트위터 헤더 사이즈)</div>
        </div>
        <div id="stickerLayer"></div>
        <div class="card-body">

          <div class="section-label"><span class="bar"></span><span>MAIN</span></div>
          <div class="identity-row">
            <span class="nickname" id="pvNickname">닉네임</span>
            <span class="account" id="pvAccount">(@계정)</span>
          </div>
          <div class="hashtag-preview" id="pvHashtags"></div>

          <div class="info-box" id="guideBox">
            <div class="info-head"><b>안내사항</b></div>
            <div class="info-content" id="pvGuide"></div>
          </div>

          <div class="info-box" id="cautionBox">
            <div class="info-head"><b>주의사항</b></div>
            <div class="info-content" id="pvCaution"></div>
          </div>

          <div class="section-label"><span class="bar"></span><span>PAIR</span></div>
          <div class="pair-grid" id="pvPairGrid"></div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- state ---------------- */
const state = {
  accent: '#ec6a8f',
  banner: null,
  bannerPos: { x:50, y:50 },
  stickers: [], // {id, src, x, y, size}
  nickname: '',
  account: '',
  presetTags: ['일상','1차','2차','드림','TRPG','고정','자유','팔로우환영'],
  tags: [], // {label}
  guideText: '',
  cautionText: '',
  pairs: [ makePair() ]
};

function makePair(){
  return { id: cryptoId(), photo:null, shape:'rect', icon:'heart', name:'', desc:'' };
}
function cryptoId(){ return Math.random().toString(36).slice(2,9); }

function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function luminance(hex){
  const {r,g,b} = hexToRgb(hex);
  const a=[r,g,b].map(v=>{
    v/=255;
    return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
  });
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
}
function applyAccent(hex){
  state.accent = hex;
  const textColor = luminance(hex) > 0.5 ? '#141414' : '#ffffff';
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-text', textColor);
}

/* ---------------- render: preview ---------------- */
function renderPreview(){
  document.getElementById('pvNickname').textContent = state.nickname || '닉네임';
  document.getElementById('pvAccount').textContent = state.account ? '(@'+state.account.replace(/^@/,'')+')' : '(@계정)';

  // hashtags
  const htagBox = document.getElementById('pvHashtags');
  htagBox.innerHTML = state.tags.map(t=>`<span class="hchip">#${escapeHtml(t.label)}</span>`).join('');

  // guide / caution -> each line becomes a bullet point
  document.getElementById('pvGuide').innerHTML = renderBullets(state.guideText);
  document.getElementById('pvCaution').innerHTML = renderBullets(state.cautionText);

  // banner
  const bannerArea = document.getElementById('bannerArea');
  const placeholder = document.getElementById('bannerPlaceholder');
  if(state.banner){
    bannerArea.style.backgroundImage = `url(${state.banner})`;
    bannerArea.style.backgroundPosition = `${state.bannerPos.x}% ${state.bannerPos.y}%`;
    bannerArea.style.cursor = 'grab';
    placeholder.style.display = 'none';
  } else {
    bannerArea.style.backgroundImage = 'none';
    bannerArea.style.cursor = 'default';
    placeholder.style.display = 'flex';
  }
  // stickers overlay across the whole card (not limited to banner)
  const stickerLayer = document.getElementById('stickerLayer');
  stickerLayer.querySelectorAll('.sticker').forEach(el=>el.remove());
  state.stickers.forEach(st=>{
    const div = document.createElement('div');
    div.className = 'sticker';
    div.style.left = st.x+'%';
    div.style.top = st.y+'%';
    div.style.width = st.size+'px';
    div.style.height = st.size+'px';
    div.dataset.id = st.id;
    div.innerHTML = `<img src="${st.src}" draggable="false">`;
    makeDraggable(div, st);
    stickerLayer.appendChild(div);
  });

  // pairs
  const grid = document.getElementById('pvPairGrid');
  grid.innerHTML = state.pairs.map(p=>{
    const iconChar = p.icon === 'heart' ? '♥' : '★';
    const nameHtml = `<div class="pair-name"><span class="ico">${iconChar}</span>${escapeHtml(p.name)||'페어명'}</div><div class="pair-desc">${escapeHtml(p.desc)||'한 줄 설명'}</div>`;
    if(p.photo){
      return `<div class="pair-card">
        <div class="pair-photo ${p.shape}">
          <img src="${p.photo}">
          <div class="grad"></div>
          <div class="pair-text">${nameHtml}</div>
        </div>
      </div>`;
    } else {
      return `<div class="pair-card">
        <div class="pair-photo ${p.shape}"><div class="pair-photo-empty">사진 없음</div></div>
        <div class="pair-no-photo-text">${nameHtml}</div>
      </div>`;
    }
  }).join('');
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderBullets(text){
  const lines = (text||'').split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0){
    return '<div class="bullet-line placeholder">내용을 입력해주세요.</div>';
  }
  return lines.map(l=>`<div class="bullet-line"><span class="bullet-dot"></span><span class="bullet-text">${escapeHtml(l)}</span></div>`).join('');
}

/* ---------------- sticker drag ---------------- */
function makeDraggable(el, st){
  let dragging = false, offX=0, offY=0, parentRect;
  el.addEventListener('pointerdown', e=>{
    dragging = true;
    el.classList.add('dragging');
    parentRect = el.parentElement.getBoundingClientRect();
    offX = e.clientX - el.getBoundingClientRect().left;
    offY = e.clientY - el.getBoundingClientRect().top;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    let x = ((e.clientX - parentRect.left - offX) / parentRect.width) * 100;
    let y = ((e.clientY - parentRect.top - offY) / parentRect.height) * 100;
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    st.x = x; st.y = y;
    el.style.left = x+'%';
    el.style.top = y+'%';
  });
  const stop = e=>{ dragging=false; el.classList.remove('dragging'); };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
}

/* ---------------- render: editor lists ---------------- */
function renderStickerEditorList(){
  const box = document.getElementById('stickerList');
  box.innerHTML = state.stickers.map(st=>`
    <div class="sticker-item">
      <img class="sticker-thumb" src="${st.src}">
      <span>스티커</span>
      <input type="range" min="40" max="200" value="${st.size}" data-id="${st.id}" class="stickerSize" style="width:70px;">
      <button class="mini-btn" data-id="${st.id}" onclick="removeSticker('${st.id}')">삭제</button>
    </div>
  `).join('');
  box.querySelectorAll('.stickerSize').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const st = state.stickers.find(s=>s.id===e.target.dataset.id);
      st.size = parseInt(e.target.value);
      renderPreview();
    });
  });
  document.getElementById('stickerUploadBtn').style.opacity = state.stickers.length>=3 ? '0.4' : '1';
  document.getElementById('stickerInput').disabled = state.stickers.length>=3;
}
function removeSticker(id){
  state.stickers = state.stickers.filter(s=>s.id!==id);
  renderStickerEditorList();
  renderPreview();
}

function renderHashtagPresets(){
  const box = document.getElementById('hashtagPresets');
  box.innerHTML = state.presetTags.map(label=>{
    const active = state.tags.some(t=>t.label===label);
    return `<button type="button" class="htag-btn ${active?'active':''}" data-label="${escapeHtml(label)}">#${escapeHtml(label)}</button>`;
  }).join('');
  box.querySelectorAll('.htag-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const label = btn.dataset.label;
      const idx = state.tags.findIndex(t=>t.label===label);
      if(idx>-1){ state.tags.splice(idx,1); }
      else { state.tags.push({label}); }
      renderHashtagPresets();
      renderSelectedTags();
      renderPreview();
    });
  });
}
function renderSelectedTags(){
  const box = document.getElementById('selectedTagsBox');
  box.innerHTML = state.tags.map(t=>`
    <span class="selected-tag-chip">#${escapeHtml(t.label)}
      <button onclick="removeTag('${t.label.replace(/'/g,"\\'")}')">✕</button>
    </span>
  `).join('');
}
function removeTag(label){
  state.tags = state.tags.filter(t=>t.label!==label);
  renderHashtagPresets();
  renderSelectedTags();
  renderPreview();
}

function renderPairEditorList(){
  const box = document.getElementById('pairEditorList');
  box.innerHTML = state.pairs.map((p,i)=>`
    <div class="pair-editor-item" data-id="${p.id}">
      <div class="pair-editor-head">
        <b>PAIR ${i+1}</b>
        <button class="mini-btn" onclick="removePair('${p.id}')" ${state.pairs.length<=1?'disabled':''}>삭제</button>
      </div>
      <label class="upload-btn">${p.photo? '사진 변경' : '사진 업로드'}
        <input type="file" accept="image/*" class="pairPhotoInput" data-id="${p.id}">
      </label>
      <div class="shape-choice">
        <button type="button" class="pairShapeBtn ${p.shape==='rect'?'active':''}" data-id="${p.id}" data-shape="rect">직사각형</button>
        <button type="button" class="pairShapeBtn ${p.shape==='square'?'active':''}" data-id="${p.id}" data-shape="square">정사각형</button>
      </div>
      <div class="icon-choice">
        <button type="button" class="pairIconBtn ${p.icon==='heart'?'active':''}" data-id="${p.id}" data-icon="heart">♥</button>
        <button type="button" class="pairIconBtn ${p.icon==='star'?'active':''}" data-id="${p.id}" data-icon="star">★</button>
      </div>
      <input type="text" placeholder="페어명" class="pairNameInput" data-id="${p.id}" value="${escapeHtml(p.name)}">
      <input type="text" placeholder="한 줄 부가 설명" class="pairDescInput" data-id="${p.id}" value="${escapeHtml(p.desc)}">
    </div>
  `).join('');

  box.querySelectorAll('.pairPhotoInput').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        const p = state.pairs.find(p=>p.id===e.target.dataset.id);
        p.photo = ev.target.result;
        renderPreview();
      };
      reader.readAsDataURL(file);
    });
  });
  box.querySelectorAll('.pairShapeBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = state.pairs.find(p=>p.id===btn.dataset.id);
      p.shape = btn.dataset.shape;
      renderPairEditorList();
      renderPreview();
    });
  });
  box.querySelectorAll('.pairIconBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = state.pairs.find(p=>p.id===btn.dataset.id);
      p.icon = btn.dataset.icon;
      renderPairEditorList();
      renderPreview();
    });
  });
  box.querySelectorAll('.pairNameInput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const p = state.pairs.find(p=>p.id===e.target.dataset.id);
      p.name = e.target.value;
      renderPreview();
    });
  });
  box.querySelectorAll('.pairDescInput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const p = state.pairs.find(p=>p.id===e.target.dataset.id);
      p.desc = e.target.value;
      renderPreview();
    });
  });

  document.getElementById('addPairBtn').disabled = state.pairs.length>=8;
}
function removePair(id){
  if(state.pairs.length<=1) return;
  state.pairs = state.pairs.filter(p=>p.id!==id);
  renderPairEditorList();
  renderPreview();
}

/* ---------------- events: top level ---------------- */
document.getElementById('accentPicker').addEventListener('input', e=>{
  applyAccent(e.target.value);
});

document.getElementById('bannerInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    state.banner = ev.target.result;
    state.bannerPos = { x:50, y:50 };
    renderPreview();
  };
  reader.readAsDataURL(file);
});

/* ---------------- banner drag-to-reposition ---------------- */
(function(){
  const bannerArea = document.getElementById('bannerArea');
  let dragging = false;
  let start = {x:0,y:0};
  let startPos = {x:50,y:50};

  bannerArea.addEventListener('pointerdown', e=>{
    if(!state.banner) return;
    dragging = true;
    start = { x:e.clientX, y:e.clientY };
    startPos = { x: state.bannerPos.x, y: state.bannerPos.y };
    bannerArea.style.cursor = 'grabbing';
    bannerArea.setPointerCapture(e.pointerId);
  });
  bannerArea.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const rect = bannerArea.getBoundingClientRect();
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    let nx = startPos.x - (dx / rect.width) * 100;
    let ny = startPos.y - (dy / rect.height) * 100;
    nx = Math.max(0, Math.min(100, nx));
    ny = Math.max(0, Math.min(100, ny));
    state.bannerPos.x = nx;
    state.bannerPos.y = ny;
    bannerArea.style.backgroundPosition = `${nx}% ${ny}%`;
  });
  const stopDrag = ()=>{
    dragging = false;
    bannerArea.style.cursor = state.banner ? 'grab' : 'default';
  };
  bannerArea.addEventListener('pointerup', stopDrag);
  bannerArea.addEventListener('pointercancel', stopDrag);
  bannerArea.addEventListener('pointerleave', ()=>{ if(dragging) stopDrag(); });
})();

document.getElementById('stickerInput').addEventListener('change', e=>{
  if(state.stickers.length>=3) return;
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    state.stickers.push({ id:cryptoId(), src:ev.target.result, x:10+state.stickers.length*15, y:10, size:90 });
    renderStickerEditorList();
    renderPreview();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

document.getElementById('nicknameInput').addEventListener('input', e=>{
  state.nickname = e.target.value; renderPreview();
});
document.getElementById('accountInput').addEventListener('input', e=>{
  state.account = e.target.value; renderPreview();
});
document.getElementById('guideInput').addEventListener('input', e=>{
  state.guideText = e.target.value;
  renderPreview();
});
document.getElementById('cautionInput').addEventListener('input', e=>{
  state.cautionText = e.target.value;
  renderPreview();
});
document.getElementById('addTagBtn').addEventListener('click', addCustomTag);
document.getElementById('customTagInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); addCustomTag(); }
});
function addCustomTag(){
  const inp = document.getElementById('customTagInput');
  const label = inp.value.trim().replace(/^#/,'');
  if(!label) return;
  if(!state.tags.some(t=>t.label===label)){
    state.tags.push({label});
  }
  inp.value='';
  renderHashtagPresets();
  renderSelectedTags();
  renderPreview();
}
document.getElementById('addPairBtn').addEventListener('click', ()=>{
  if(state.pairs.length>=8) return;
  state.pairs.push(makePair());
  renderPairEditorList();
  renderPreview();
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const card = document.getElementById('card');
  document.querySelectorAll('.sticker').forEach(s=>s.style.cursor='default');
  html2canvas(card, { backgroundColor:'#ffffff', scale:2, useCORS:true }).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'sns_intro.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

/* ---------------- init ---------------- */
applyAccent(state.accent);
renderStickerEditorList();
renderHashtagPresets();
renderSelectedTags();
renderPairEditorList();
renderPreview();
</script>
