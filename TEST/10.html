<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>페어틀4</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #f5f5f7;
  font-family: -apple-system, 'Malgun Gothic', 'Helvetica Neue', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 60px;
  gap: 20px;
}

/* ─── SECTION CARD (editor) ─── */
.card {
  background: #fff;
  padding: 20px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.04);
}
.card-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 14px;
}

.field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field:last-child { margin-bottom:0; }
.field label { font-size:11px; color:#aaa; font-weight:500; }
.toggle-row {
  display:flex; align-items:center; gap:8px;
  cursor:pointer; user-select:none;
}
.toggle-row input[type="checkbox"] {
  width:17px; height:17px; accent-color:#111; cursor:pointer; flex-shrink:0;
}
.toggle-row span { font-size:13px; color:#333; font-weight:500; }
.field input[type="text"],
.field input[type="number"] {
  border: 1.5px solid #e8e8e8;
  font-size: 14px;
  color: #111;
  padding: 9px 12px;
  outline: none;
  transition: border-color .15s;
  background: #fafafa;
  width: 100%;
}
.field input:focus { border-color: #000; background: #fff; }

.two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.color-row { display:flex; align-items:center; gap:10px; }
.color-row input[type="color"] {
  width:38px; height:38px;
  border:1.5px solid #e8e8e8;
  padding:0;
  cursor:pointer;
  background:#fafafa;
  flex-shrink:0;
}
.color-row input[type="text"] { flex:1; }

.upload-zone {
  border: 1.5px dashed #d8d8d8;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  background: #fafafa;
  user-select: none;
}
.upload-zone:hover { border-color: #aaa; background: #f2f2f2; }
.upload-zone-label { font-size: 13px; color: #999; font-weight: 500; }
.upload-zone-sub { font-size: 11px; color: #bbb; margin-top: 3px; }
input[type="file"] { display:none; }

/* ─── LYRICS LIST ─── */
.lyric-row {
  border: 1.5px solid #efefef;
  padding: 10px;
  display:flex;
  align-items:center;
  gap:8px;
  background: #fafafa;
  margin-bottom:8px;
}
.lyric-row input[type="text"] {
  flex:1;
  border: 1.5px solid #e8e8e8;
  font-size: 13px;
  color: #111;
  padding: 8px 10px;
  outline: none;
  background: #fff;
  transition: border-color .15s;
}
.lyric-row input[type="text"]:focus { border-color:#000; }
.lyric-hl {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; color:#aaa; cursor:pointer; user-select:none; flex-shrink:0;
  width:44px; white-space:nowrap;
}
.lyric-hl input {
  width:15px; height:15px; min-width:15px; min-height:15px;
  accent-color:#3c5fe0; cursor:pointer; flex-shrink:0;
  -webkit-appearance:checkbox; appearance:checkbox;
}
.lyric-del {
  width:24px; height:24px;
  border:none;
  background:#f0f0f0;
  color:#999;
  font-size:15px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  transition: background .15s, color .15s;
}
.lyric-del:hover { background:#ffe0e0; color:#e53935; }

.add-btn {
  border: 1.5px dashed #d0d0d0;
  background: transparent;
  color: #aaa;
  font-size: 13px;
  font-weight: 500;
  padding: 10px;
  cursor: pointer;
  width: 100%;
  transition: border-color .15s, color .15s;
}
.add-btn:hover { border-color: #888; color: #555; }

.export-btn {
  background: #111;
  border: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 15px;
  cursor: pointer;
  width: 100%;
  max-width: 440px;
  letter-spacing: .02em;
  transition: background .15s, transform .1s;
}
.export-btn:hover { background: #333; }
.export-btn:active { transform:scale(.98); }

/* ─── PLAYER PREVIEW (target design) ─── */
.player-wrap { width:100%; max-width:440px; }

/* ─── STAGE (player 카드 뒤 3:5 배경) ─── */
.player-stage {
  position:relative;
  width:100%;
  border-radius:0;
  overflow:hidden;
  background: linear-gradient(135deg,#dfe3ee,#c7cee0);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:46px 30px;
}
.stage-bg {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover;
  filter: blur(30px) brightness(.82) saturate(1.25);
  transform: scale(1.18);
  display:none;
}

#player {
  --accent: #000000;
  position:relative;
  z-index:2;
  width:100%;
  background: #fff;
  border-radius: 26px;
  padding: 14px 14px 18px;
  box-shadow: 0 10px 34px rgba(30,42,74,.14), 0 2px 8px rgba(30,42,74,.06);
  font-family: -apple-system, 'Malgun Gothic', 'Helvetica Neue', sans-serif;
  transition: background .2s;
}

#player.dark { background:#000; box-shadow: 0 10px 34px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.2); }
#player.dark .p-title { color:#fff; }
#player.dark .p-artist,
#player.dark .p-times { color:#7d818d; }
#player.dark .p-bar-bg { background:#2c2c30; }
#player.dark .p-lyrics { color:#54565f; }

.player-img-wrap { position:relative; width:100%; aspect-ratio:1/1; border-radius:18px; overflow:hidden; background:#e8eaf0; }
.player-bg { width:100%; height:100%; object-fit:cover; display:none; }
.player-bg-empty {
  width:100%; height:100%;
  background: linear-gradient(135deg,#dfe3ee,#c7cee0);
  display:flex; align-items:center; justify-content:center;
  color:#9aa3b8; font-size:12px; font-weight:500;
}

.p-title {
  margin-top:16px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  color:#1c2a4a;
  letter-spacing:-.01em;
  word-break:keep-all;
}
.p-artist {
  margin-top:4px;
  text-align:center;
  font-size:11.5px;
  font-weight:500;
  color:#9aa3b8;
}

.p-controls {
  margin-top:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}
.p-controls svg { display:block; }
.p-ctrl-icon { color: var(--accent); }
.p-ctrl-icon.side { color: var(--accent); }

.p-progress { margin-top:14px; padding:0 2px; }
.p-bar-bg {
  width:100%; height:3px; background:#e6e8f0;
  border-radius:2px; position:relative;
}
.p-bar-fill { height:100%; background: var(--accent); border-radius:2px; }
.p-bar-dot {
  position:absolute; top:50%; width:9px; height:9px; border-radius:50%;
  background: var(--accent); transform:translate(-50%,-50%);
}
.p-times { display:flex; justify-content:space-between; margin-top:6px; color:#9aa3b8; font-size:11px; font-weight:500; }

.p-lyrics {
  padding:30px 6px; /* 위/아래 여백 30px 고정, 가사 줄 수만큼 세로로 늘어남 */
  min-height:7.6em; /* line-height 1.9 기준 최소 4줄 분량 확보, 4줄 초과 시 자유롭게 늘어남 */
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  font-size:12px;
  line-height:1.9;
  color:#a7afc0;
}
.p-lyrics .hl { color: var(--accent); font-weight:700; }

/* ─── CROP MODAL (재사용) ─── */
.modal-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.6); z-index:1000;
  align-items:center; justify-content:center;
  padding:16px;
}
.modal-overlay.open { display:flex; }
.modal {
  background:#fff;
  width:100%; max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  overflow:hidden;
}
.modal-head {
  padding:16px 20px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid #f0f0f0;
}
.modal-head h3 { font-size:15px; font-weight:600; color:#111; }
.modal-close {
  background:#f0f0f0; border:none;
  width:28px; height:28px; font-size:16px;
  cursor:pointer; color:#666; display:flex; align-items:center; justify-content:center;
}
.crop-viewport {
  position:relative;
  width:100%; max-width:360px;
  aspect-ratio:1/1;
  margin:0 auto;
  background:#222;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}
.crop-viewport:active { cursor:grabbing; }
.crop-drag-img {
  position:absolute; top:0; left:0;
  transform-origin:0 0;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}
.crop-zoom-row {
  display:flex; align-items:center; gap:10px;
  padding:16px 20px 4px;
}
.crop-zoom-row svg { flex-shrink:0; color:#999; }
.crop-zoom-row input[type="range"] {
  flex:1;
  -webkit-appearance:none;
  appearance:none;
  height:4px;
  border-radius:2px;
  background:#e8e8e8;
  outline:none;
}
.crop-zoom-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:18px; height:18px;
  border-radius:50%;
  background:#111;
  cursor:pointer;
}
.crop-zoom-row input[type="range"]::-moz-range-thumb {
  width:18px; height:18px; border:none;
  border-radius:50%;
  background:#111;
  cursor:pointer;
}
.modal-hint { padding:8px 20px; font-size:11px; color:#aaa; background:#fafafa; border-bottom:1px solid #f0f0f0; }
.modal-actions { padding:14px 20px; display:flex; gap:10px; }
.btn-cancel {
  flex:1; padding:11px; border:1.5px solid #e0e0e0;
  background:#fff; color:#555; font-size:14px; font-weight:500; cursor:pointer;
}
.btn-apply {
  flex:2; padding:11px; border:none;
  background:#111; color:#fff; font-size:14px; font-weight:600; cursor:pointer;
}
.btn-cancel:hover { background:#f5f5f5; }
.btn-apply:hover { background:#333; }
</style>

<!-- ─── 앨범 아트 ─── -->
<div class="card">

      <svg class="p-ctrl-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12L18 6v12z"/></svg>

<!-- ─── CROP MODAL ─── -->
<div class="modal-overlay" id="cropModal">
  <div class="modal">
    <div class="modal-head">
      <h3>사진 자르기</h3>
      <button class="modal-close" onclick="closeCrop()">×</button>
    </div>
    <div class="modal-hint">사진을 드래그해서 위치를 옮기고, 아래 슬라이더로 확대/축소하세요</div>
    <div class="crop-viewport" id="cropViewport">
      <img id="cropDragImg" class="crop-drag-img" draggable="false">
    </div>
    <div class="crop-zoom-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.65" y1="16.65" x2="21" y2="21"/></svg>
      <input type="range" id="zoomSlider" min="100" max="300" value="100" oninput="onZoomChange()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.65" y1="16.65" x2="21" y2="21"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCrop()">취소</button>
      <button class="btn-apply" onclick="applyCrop()">적용</button>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stackblur-canvas/2.7.0/stackblur.min.js"></script>
<script>
// ── State ──
let lyrics = [
  { text:'', hl:false },
  { text:'', hl:false },
  { text:'', hl:false },
  { text:'', hl:false },
];

let cropImg = new Image();
let baseScale = 1;      // 뷰포트를 꽉 채우는 최소 배율
let zoomFactor = 1;     // 슬라이더로 조절하는 추가 배율 (1 = 100%)
let imgX = 0, imgY = 0; // 이미지 좌상단 위치 (뷰포트 기준 px)
let viewportSize = 0;

// ─────────────────────────────────────────────
// CROP (드래그로 이동 + 슬라이더로 확대/축소)
// ─────────────────────────────────────────────
function openCrop(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    cropImg = new Image();
    cropImg.onload = () => {
      document.getElementById('cropModal').classList.add('open');
      document.body.style.overflow = 'hidden';
      document.body.style.position = 'fixed';
      document.body.style.width = '100%';
      document.getElementById('cropDragImg').src = ev.target.result;
      requestAnimationFrame(initCropUI);
    };
    cropImg.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function initCropUI() {
  const vp = document.getElementById('cropViewport');
  viewportSize = vp.getBoundingClientRect().width;
  baseScale = Math.max(viewportSize / cropImg.naturalWidth, viewportSize / cropImg.naturalHeight);
  zoomFactor = 1;
  document.getElementById('zoomSlider').value = 100;

  const dispW = cropImg.naturalWidth * baseScale;
  const dispH = cropImg.naturalHeight * baseScale;
  imgX = (viewportSize - dispW) / 2;
  imgY = (viewportSize - dispH) / 2;
  applyImgTransform();
}

function applyImgTransform() {
  const scale = baseScale * zoomFactor;
  const dispW = cropImg.naturalWidth * scale;
  const dispH = cropImg.naturalHeight * scale;
  imgX = Math.min(0, Math.max(viewportSize - dispW, imgX));
  imgY = Math.min(0, Math.max(viewportSize - dispH, imgY));
  const img = document.getElementById('cropDragImg');
  img.style.width = dispW + 'px';
  img.style.height = dispH + 'px';
  img.style.transform = `translate(${imgX}px, ${imgY}px)`;
}

function onZoomChange() {
  const scaleOld = baseScale * zoomFactor;
  // 뷰포트 중심이 가리키던 원본 이미지 좌표를 기억
  const centerNaturalX = (viewportSize / 2 - imgX) / scaleOld;
  const centerNaturalY = (viewportSize / 2 - imgY) / scaleOld;

  zoomFactor = document.getElementById('zoomSlider').value / 100;
  const scaleNew = baseScale * zoomFactor;

  // 같은 지점이 계속 중심에 오도록 위치 재계산
  imgX = viewportSize / 2 - centerNaturalX * scaleNew;
  imgY = viewportSize / 2 - centerNaturalY * scaleNew;
  applyImgTransform();
}

// ── 드래그(팬) ──
let panActive = false;
let panStart = { x:0, y:0, imgX:0, imgY:0 };

function panPointerDown(e) {
  panActive = true;
  panStart = { x: e.clientX, y: e.clientY, imgX, imgY };
  e.currentTarget.setPointerCapture(e.pointerId);
  e.preventDefault();
}
function panPointerMove(e) {
  if (!panActive) return;
  imgX = panStart.imgX + (e.clientX - panStart.x);
  imgY = panStart.imgY + (e.clientY - panStart.y);
  applyImgTransform();
  e.preventDefault();
}
function panPointerEnd() { panActive = false; }

const cropViewportEl = document.getElementById('cropViewport');
cropViewportEl.addEventListener('pointerdown', panPointerDown);
cropViewportEl.addEventListener('pointermove', panPointerMove);
cropViewportEl.addEventListener('pointerup', panPointerEnd);
cropViewportEl.addEventListener('pointercancel', panPointerEnd);

function applyCrop() {
  const scale = baseScale * zoomFactor;
  const cropX = -imgX / scale;
  const cropY = -imgY / scale;
  const cropSize = viewportSize / scale;

  const offscreen = document.createElement('canvas');
  const maxOut = 1200;
  const size = Math.min(Math.round(cropSize), maxOut);
  offscreen.width = size;
  offscreen.height = size;
  const ctx = offscreen.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(cropImg, cropX, cropY, cropSize, cropSize, 0, 0, size, size);
  const dataUrl = offscreen.toDataURL('image/jpeg', 0.97);

  const img = document.getElementById('playerBg');
  img.src = dataUrl;
  img.style.display = 'block';
  document.getElementById('playerBgEmpty').style.display = 'none';

  const stageBg = document.getElementById('stageBg');
  stageBg.src = dataUrl;
  stageBg.style.display = 'block';

  closeCrop();
}

function closeCrop() {
  document.getElementById('cropModal').classList.remove('open');
  document.body.style.overflow = '';
  document.body.style.position = '';
}

// ─────────────────────────────────────────────
// LYRICS
// ─────────────────────────────────────────────
function renderLyricList() {
  const el = document.getElementById('lyricList');
  el.innerHTML = '';
  lyrics.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'lyric-row';
    row.innerHTML = `
      <input type="text" value="${esc(l.text)}" placeholder="가사 한 줄"
        oninput="lyrics[${i}].text=this.value; renderLyrics();">
      <label class="lyric-hl">
        <input type="checkbox" ${l.hl ? 'checked' : ''} onchange="lyrics[${i}].hl=this.checked; renderLyrics();">
        강조
      </label>
      ${lyrics.length > 1 ? `<button class="lyric-del" onclick="removeLyric(${i})">×</button>` : ''}
    `;
    el.appendChild(row);
  });
  document.getElementById('addLyricBtn').style.display = lyrics.length >= 12 ? 'none' : '';
}

function addLyric() {
  if (lyrics.length >= 12) return;
  lyrics.push({ text:'', hl:false });
  renderLyricList();
  renderLyrics();
}

function removeLyric(i) {
  if (lyrics.length <= 1) return;
  lyrics.splice(i, 1);
  renderLyricList();
  renderLyrics();
}

function renderLyrics() {
  const el = document.getElementById('lyricsEl');
  el.innerHTML = lyrics.map(l =>
    `<div class="${l.hl ? 'hl' : ''}">${esc(l.text)}</div>`
  ).join('');
}

// ─────────────────────────────────────────────
// PLAYER UPDATE
// ─────────────────────────────────────────────
function onDarkModeChange() {
  const on = document.getElementById('darkModeToggle').checked;
  document.getElementById('player').classList.toggle('dark', on);
}

function onAccentColorChange() {
  const val = document.getElementById('accentColor').value;
  document.getElementById('accentColorText').value = val;
  document.getElementById('player').style.setProperty('--accent', val);
}

function onAccentColorTextChange() {
  let val = document.getElementById('accentColorText').value.trim();
  if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(val)) return;
  document.getElementById('accentColor').value = val;
  document.getElementById('player').style.setProperty('--accent', val);
}

function updatePlayer() {
  const title = document.getElementById('mainTitle').value;
  const artist = document.getElementById('mainArtist').value;
  let cur = parseInt(document.getElementById('currentSec').value) || 0;
  let tot = parseInt(document.getElementById('totalSec').value) || 0;
  if (cur > tot && tot > 0) cur = tot;

  document.getElementById('dispTitleText').textContent = title;
  document.getElementById('dispArtist').textContent = artist;
  document.getElementById('dispCur').textContent = fmt(cur);
  document.getElementById('dispTot').textContent = fmt(tot);

  const pct = tot > 0 ? Math.min(100, (cur / tot) * 100) : 0;
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pDot').style.left = pct + '%';

  renderLyrics();
}

// ─────────────────────────────────────────────
// html2canvas는 CSS filter(blur 등)를 지원하지 않고, iOS Safari 등 일부
// 브라우저는 Canvas 2D의 ctx.filter 자체도 제대로 동작하지 않아 이미지가
// 통째로 사라질 수 있다. 그래서 ctx.filter에 의존하지 않고
// 1) 픽셀 단위로 밝기/채도를 직접 계산 → 2) StackBlur 라이브러리로 블러를
// 적용하는 방식으로 이미지를 미리 "구워서(bake)" 만든다.
// ─────────────────────────────────────────────
function bakeBlurredImage(imgEl, opts) {
  return new Promise((resolve) => {
    try {
      const { blurRadius, brightness, saturate, scale } = opts;
      const w = imgEl.naturalWidth || imgEl.width;
      const h = imgEl.naturalHeight || imgEl.height;
      if (!w || !h) return resolve(null);

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // 1) transform: scale(1.18)과 동일한 효과: 이미지를 확대해서 그린다.
      const sw = w * scale, sh = h * scale;
      const dx = (w - sw) / 2, dy = (h - sh) / 2;
      ctx.drawImage(imgEl, dx, dy, sw, sh);

      // 2) 밝기 / 채도 보정을 픽셀 단위로 직접 계산 (ctx.filter 미사용)
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        let r = d[i] * brightness;
        let g = d[i+1] * brightness;
        let b = d[i+2] * brightness;
        const gray = 0.2126*r + 0.7152*g + 0.0722*b;
        r = gray + (r - gray) * saturate;
        g = gray + (g - gray) * saturate;
        b = gray + (b - gray) * saturate;
        d[i]   = r < 0 ? 0 : r > 255 ? 255 : r;
        d[i+1] = g < 0 ? 0 : g > 255 ? 255 : g;
        d[i+2] = b < 0 ? 0 : b > 255 ? 255 : b;
      }
      ctx.putImageData(imgData, 0, 0);

      // 3) StackBlur로 블러 적용 (ctx.filter 미사용, 순수 픽셀 연산이라 호환성 높음)
      if (window.StackBlur && blurRadius > 0) {
        StackBlur.canvasRGBA(canvas, 0, 0, w, h, Math.round(blurRadius));
      }

      resolve(canvas.toDataURL('image/png'));
    } catch (err) {
      resolve(null);
    }
  });
}

// ─────────────────────────────────────────────
// object-fit:cover와 동일하게 이미지를 target 영역에 그려주는 헬퍼
// ─────────────────────────────────────────────
function drawCover(ctx, img, x, y, w, h) {
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  const ir = iw / ih, tr = w / h;
  let sx, sy, sw, sh;
  if (ir > tr) {
    sh = ih; sw = ih * tr; sx = (iw - sw) / 2; sy = 0;
  } else {
    sw = iw; sh = iw / tr; sx = 0; sy = (ih - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = src;
  });
}

// ─────────────────────────────────────────────
// EXPORT
// html2canvas는 blur/transform이 걸린 배경 이미지를 안정적으로 캡처하지 못하는
// 경우가 있어서, 아예 배경은 우리가 직접 canvas에 그려서 합성하고
// html2canvas는 흰 카드(#player) 부분만 캡처해서 그 위에 얹는다.
// ─────────────────────────────────────────────
async function exportPNG() {
  const btn = document.querySelector('.export-btn');
  btn.textContent = '저장 중...';
  btn.disabled = true;
  try {
    const stage = document.getElementById('playerStage');
    const player = document.getElementById('player');
    const stageBg = document.getElementById('stageBg');
    const OUT_SCALE = 4;

    // 이미지 로딩이 아직 안 끝났으면 기다린다.
    if (stageBg.style.display !== 'none' && stageBg.src && !stageBg.complete) {
      await new Promise(res => { stageBg.onload = res; stageBg.onerror = res; });
    }

    const stageRect = stage.getBoundingClientRect();
    const playerRect = player.getBoundingClientRect();
    const outW = Math.max(1, Math.round(stageRect.width * OUT_SCALE));
    const outH = Math.max(1, Math.round(stageRect.height * OUT_SCALE));

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = outW;
    finalCanvas.height = outH;
    const fctx = finalCanvas.getContext('2d');

    // 1) 배경 그리기
    if (stageBg.style.display !== 'none' && stageBg.src && stageBg.naturalWidth) {
      const displayedWidth = stageRect.width || stageBg.naturalWidth;
      const ratio = stageBg.naturalWidth / displayedWidth;
      const bakedUrl = await bakeBlurredImage(stageBg, {
        blurRadius: 30 * ratio,
        brightness: 0.82,
        saturate: 1.25,
        scale: 1.18
      });
      if (bakedUrl) {
        const bakedImg = await loadImage(bakedUrl);
        drawCover(fctx, bakedImg, 0, 0, outW, outH);
      } else {
        // 굽기에 실패해도 최소한 원본 사진은 배경으로 깔아준다.
        drawCover(fctx, stageBg, 0, 0, outW, outH);
      }
    } else {
      const grad = fctx.createLinearGradient(0, 0, outW, outH);
      grad.addColorStop(0, '#dfe3ee');
      grad.addColorStop(1, '#c7cee0');
      fctx.fillStyle = grad;
      fctx.fillRect(0, 0, outW, outH);
    }

    // 2) 흰 카드(#player)만 html2canvas로 캡처 (배경 투명)
    const playerCanvas = await html2canvas(player, {
      scale: OUT_SCALE,
      useCORS: true,
      backgroundColor: null,
      logging: false,
      allowTaint: true,
      imageTimeout: 15000
    });

    // 3) 카드가 스테이지 안에서 차지하는 위치에 맞춰 합성
    const offsetX = Math.round((playerRect.left - stageRect.left) * OUT_SCALE);
    const offsetY = Math.round((playerRect.top - stageRect.top) * OUT_SCALE);
    fctx.drawImage(playerCanvas, offsetX, offsetY, playerCanvas.width, playerCanvas.height);

    // canvas -> Blob 변환 (다운로드/공유 모두에 사용)
    const blob = await new Promise(res => finalCanvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('blob 생성 실패');

    const file = new File([blob], 'lyrics-card.png', { type: 'image/png' });

    // 1) iOS/모바일: 공유 시트로 "사진에 저장" 가능하면 우선 사용
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        btn.textContent = 'PNG 저장';
        btn.disabled = false;
        return;
      } catch (shareErr) {
        // 사용자가 공유를 취소한 경우는 조용히 종료
        if (shareErr && shareErr.name === 'AbortError') {
          btn.textContent = 'PNG 저장';
          btn.disabled = false;
          return;
        }
        // 공유 실패 시 아래 다운로드 방식으로 폴백
      }
    }

    const blobUrl = URL.createObjectURL(blob);

    // 2) 일반 브라우저(PC/안드로이드): a.download로 바로 저장
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (!isIOS) {
      const a = document.createElement('a');
      a.download = 'lyrics-card.png';
      a.href = blobUrl;
      a.click();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
    } else {
      // 3) iOS인데 공유 API도 안 되는 경우: 새 탭으로 열어 롱프레스 저장 유도
      window.open(blobUrl, '_blank');
      alert('이미지가 새 탭에 열립니다. 이미지를 길게 눌러 "사진에 추가"로 저장해주세요.');
    }
  } catch(e) {
    alert('PNG 저장 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
  }
  btn.textContent = 'PNG 저장';
  btn.disabled = false;
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
renderLyricList();
updatePlayer();
</script>

</html>
